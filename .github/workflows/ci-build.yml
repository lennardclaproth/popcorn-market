# This workflow will build a .NET project (for now)
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: "Popcorn market build validation"

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  dotnet-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet/src
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

  go-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
    - name: Build-Ansar-Broker
      run: go build -v ./ansar-broker/cmd/api
    - name: Test-Ansar-Broker
      run: go test -v ./ansar-broker/cmd/api
